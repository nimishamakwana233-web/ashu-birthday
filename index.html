<!DOCTYPE html>
<html>

<head>

<title>Birthday Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
background: linear-gradient(135deg,#ffd6ec,#e6d6ff);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Poppins', sans-serif;
text-align:center;
margin:0;
}

.container{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
width:300px;
}

h1{
font-family:'Pacifico', cursive;
font-size:40px;
color:#ff6fa5;
margin-bottom:10px;
}

p{
font-size:18px;
color:#555;
}

.loader{
width:220px;
height:12px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin:auto;
margin-top:20px;
}

.bar{
height:100%;
width:0%;
background:#ff6fa5;
animation:load 3s forwards;
}

@keyframes load{
from{width:0;}
to{width:100%;}
}

</style>

</head>

<body>

<div class="container">

<h1>🎂</h1>

<p>Loading your birthday surprise...</p>

<div class="loader">
<div class="bar"></div>
</div>

</div>

<script>

setTimeout(function(){
window.location.href="page2.html"
},3000)

</script>

</body>

</html>
