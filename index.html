<!DOCTYPE html>
<html>
<head>
<title>Birthday Surprise</title>

<style>

body{
background: linear-gradient(135deg,#ffd6ec,#e6d6ff);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:sans-serif;
text-align:center;
}

.loader{
width:200px;
height:10px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin:auto;
}

.bar{
height:100%;
width:0%;
background:#ff66a3;
animation:load 3s forwards;
}

@keyframes load{
from{width:0;}
to{width:100%;}
}

h1{
color:#6b4ba3;
}

</style>
</head>

<body>

<div>

<h1>🎂</h1>
<h2>Loading your birthday surprise...</h2>

<div class="loader">
<div class="bar"></div>
</div>

</div>

<script>

setTimeout(function(){
window.location.href="page2.html"
},3000)

</script>

</body>
</html>
