<!DOCTYPE html>
<html>

<head>

<title>A Cutiepie Was Born</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
background: linear-gradient(135deg,#ffd6ec,#e6d6ff);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Poppins', sans-serif;
text-align:center;
margin:0;
overflow:hidden;
}

/* floating hearts */

body::before{
content:"💗 💕 💖 💞 💓";
position:absolute;
font-size:24px;
top:100%;
left:10%;
animation:float 12s linear infinite;
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

.card{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
width:320px;
}

img{
width:220px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 6px 15px rgba(0,0,0,0.15);
}

h1{
font-family:'Pacifico', cursive;
font-size:34px;
color:#ff6fa5;
margin:10px 0;
}

p{
font-size:18px;
color:#555;
}

button{
margin-top:25px;
padding:14px 28px;
border:none;
background:#ff6fa5;
color:white;
border-radius:30px;
font-size:18px;
cursor:pointer;
font-family:'Poppins', sans-serif;
box-shadow:0 5px 12px rgba(0,0,0,0.1);
}

button:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<div class="card">

<img src="ashu.jpg">

<h1>A Cutiepie was born today 🎉</h1>

<p>
21 years ago! <br>
Yes, it's YOU Ashu 💖 <br>
A little surprise awaits...
</p>

<button onclick="nextPage()">Start the surprise 🎁</button>

</div>

<script>

function nextPage(){
window.location.href="page3.html"
}

</script>

</body>

</html>
